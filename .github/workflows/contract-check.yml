# Scheduled server-contract check. Read-only: `engini tools list` / `engini tools get` on the 21 slugs.
# Needs a read-only, workspace-scoped key with no write permissions as the repository secret ENGINI_CONTRACT_KEY.
# Fails only when a never-verb is missing or renamed; other changes are info.
name: contract-check
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: fail loudly when the key is missing
        env:
          KEY: ${{ secrets.ENGINI_CONTRACT_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::ENGINI_CONTRACT_KEY is not set - the contract is not being checked"; exit 1; }'
      - run: npm i -g @engini/cli@0.29.0
      - name: contract check
        env:
          ENGINI_API_KEY: ${{ secrets.ENGINI_CONTRACT_KEY }}
        run: python3 tools/contract-check.py
