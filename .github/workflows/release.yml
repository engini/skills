# Release vX.Y.Z of the workflow plugin from this repo. Manual only, from main, behind the `skills-release`
# environment (required reviewers, deployment branches restricted to main - admin settings), pushed by a GitHub App,
# never a staff token. FLO_RELEASE_APP_KEY must be an ENVIRONMENT secret of skills-release (CONTRIBUTING,
# "Supply chain"): as a repository secret any branch workflow could read it and skip the reviewers.
#
# Installers get only tagged code: both marketplace manifests pin the plugin to a release tag (`ref`). A release
#   1. checks the tag (vX.Y.Z, equal to both plugin manifests' version, new, ahead of the current pin) and runs every
#      gate on the main commit - before any credential exists;
#   2. makes ONE commit on top of that main commit that changes only the two marketplace pins to vX.Y.Z, and tags
#      THAT commit (so a marketplace added at the tag pins itself; plugin/ is byte-identical to the gated commit);
#   3. pushes main and the tag in one atomic push: both land or neither does. If main moved meanwhile the push is
#      rejected (no force, ever) and nothing is released - re-run from the new main.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'vX.Y.Z (must equal both plugin manifests version)'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    environment: skills-release
    steps:
      - name: main only
        if: github.ref != 'refs/heads/main'
        run: 'echo "::error::release runs from main only (got $GITHUB_REF)"; exit 1'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: the tag may be released now
        env:
          TAG: ${{ inputs.tag }}
        run: python3 tools/release-check.py --release "$TAG"
      - name: gates (before any credential is on disk)
        run: |
          set -euo pipefail
          bash tools/scrub-check.sh
          python3 tools/generate.py --check
          python3 tools/rules-check.py
          bash tools/adapter-check.sh
          python3 tools/hook-selftest.py
          python3 tools/release-check.py
          python3 tools/mutation-test.py
          npm i -g @anthropic-ai/claude-code@2.1.316
          claude plugin validate --strict plugin
          claude plugin validate --strict .
          claude plugin validate --strict --profile directory plugin
      - name: release commit and tag (local only)
        env:
          TAG: ${{ inputs.tag }}
          NAME: ${{ vars.FLO_RELEASE_NAME }}
          EMAIL: ${{ vars.FLO_RELEASE_EMAIL }}
        run: |
          set -euo pipefail
          [ -n "$NAME" ] && [ -n "$EMAIL" ] || { echo "::error::FLO_RELEASE_NAME / FLO_RELEASE_EMAIL are not set"; exit 1; }
          base=$(git rev-parse HEAD)
          python3 tools/release-check.py --bump "$TAG"
          changed=$(git status --porcelain | awk '{print $2}' | LC_ALL=C sort | tr '\n' ' ')
          [ "$changed" = ".agents/plugins/marketplace.json .claude-plugin/marketplace.json " ] || {
            echo "::error::the release commit may change only the two marketplace pins, got: $changed"; exit 1; }
          export GIT_AUTHOR_NAME="$NAME" GIT_AUTHOR_EMAIL="$EMAIL" GIT_COMMITTER_NAME="$NAME" GIT_COMMITTER_EMAIL="$EMAIL"
          git -c commit.gpgsign=false commit -q --no-verify -m "Release $TAG" -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json
          git -c tag.gpgsign=false -c user.name="$NAME" -c user.email="$EMAIL" tag -a "$TAG" -m "Release $TAG"
          [ "$(git rev-parse HEAD~1)" = "$base" ] || { echo "::error::release commit is not one commit on top of $base"; exit 1; }
          git diff --quiet "$base" HEAD -- plugin || { echo "::error::plugin/ changed in the release commit"; exit 1; }
          python3 tools/release-check.py
          claude plugin validate --strict .
          echo "hook SHA-256 (put it in the release notes): $(sha256sum plugin/hooks/deny-never-verbs.py | cut -d' ' -f1)"
      - id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.FLO_RELEASE_APP_ID }}
          private-key: ${{ secrets.FLO_RELEASE_APP_KEY }}
          owner: engini
          repositories: skills
      - name: push main and the tag atomically
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # --atomic: main and the tag land together or not at all; a fast-forward only, never --force.
          git push --atomic "https://x-access-token:${TOKEN}@github.com/engini/skills.git" \
            "HEAD:refs/heads/main" "refs/tags/$TAG:refs/tags/$TAG"
          echo "released $TAG at $(git rev-parse HEAD)"
