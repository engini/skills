# Every gate that needs no secret and no model: generated blocks, rules, hook self-test, whole-repo scrub, adapters,
# the release pin, mutation proofs, and the Claude Code validators. Actions are pinned by SHA.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0          # release-check needs the release tags
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: generated blocks are current
        run: python3 tools/generate.py --check
      - name: rules, README deny block, tool-map drift, TROUBLESHOOTING codes
        run: python3 tools/rules-check.py
      - name: hook self-test
        run: python3 tools/hook-selftest.py
      - name: scrub (whole repo)
        run: bash tools/scrub-check.sh
      - name: adapters
        run: bash tools/adapter-check.sh
      - name: release pin (both marketplaces pin an existing release tag)
        run: python3 tools/release-check.py
      - name: every gate can go red
        run: python3 tools/mutation-test.py
      - name: Claude Code validate (payload, marketplace, directory profile)
        run: |
          npm i -g @anthropic-ai/claude-code@2.1.316
          claude plugin validate --strict plugin
          claude plugin validate --strict .
          claude plugin validate --strict --profile directory plugin
